# The MegaMoE ring is sized from the pool its persistent grid drains: one
# layout per expert count and SM count the cubin carries an instance for.
[layouts]
tool = "source/moe/moe_layout.cu"
flags = "deepgemm"
includes = "deepgemm"
experts = [128, 384]
sms = [148, 152]
