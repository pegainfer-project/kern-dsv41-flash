# Every module the DeepSeek V4.1 Flash manifest launches, save the Engram
# constants derived from the checkpoint.
# `scripts/build.py` compiles each from `source` with the named `flags` and
# `includes`, writes `build/<module>.cubin`, and checks it against `sha256`.

[toolchain]
nvcc = "13.1.115"
arch = "sm_103a"

# The submodules under third_party/, each MIT-licensed by DeepSeek; `check.py`
# holds the gitlinks to these commits.
[upstreams.DeepGEMM]
url = "https://github.com/deepseek-ai/DeepGEMM"
commit = "ab69f76be5bb9ea3499bc755002b1a876cb0b3d9"
note = "PR #432, the V4.1 public release"

[upstreams.FlashMLA]
url = "https://github.com/deepseek-ai/FlashMLA"
commit = "4f38f29ef6793c228363e4af5be66d44e81167ba"
note = "PR #221, branch v41-open-source"

[upstreams.DeepSelect]
url = "https://github.com/deepseek-ai/DeepSelect"
commit = "8e70df71d2a4b0c969ef96dc3b8998efa09a3315"
note = "drops do_check_nan: older TopkSelectArgs offsets do not apply"

[flags]
default = []
plain = ["-std=c++20", "-O3"]
nofma = ["--fmad=false"]
plain-nofma = ["-std=c++20", "-O3", "--fmad=false"]
deepgemm = ["-std=c++20", "-O3", "--expt-relaxed-constexpr", "-DDG_NO_TORCH"]
lambda = ["-std=c++20", "-O3", "--expt-relaxed-constexpr", "--expt-extended-lambda", "-DNDEBUG"]

# Include paths, searched in order. `build/upstream/` is what `build.py`
# prepares from the submodules: MegaMoE forked onto kern's peer table,
# FlashMLA's fused core with its NVCC 13 fix.
[includes]
deepgemm = [
    "third_party/DeepGEMM/deep_gemm/include",
    "third_party/DeepGEMM/third-party/cutlass/include",
]
mega-moe = [
    "source/moe/include",
    "build/upstream/mega-moe",
    "third_party/DeepGEMM/deep_gemm/include",
    "third_party/DeepGEMM/third-party/cutlass/include",
]
flashmla-fused = [
    "build/upstream/flashmla-fused",
    "third_party/FlashMLA/csrc/kernels/sm100/prefill/sparse/fused_norm_rope_attn_rope_cast_fwd/core_attn",
    "third_party/FlashMLA/csrc",
    "third_party/FlashMLA/csrc/kerutils/include",
    "third_party/FlashMLA/csrc/cutlass/include",
]
deepselect = [
    "third_party/DeepSelect/csrc",
    "third_party/DeepSelect/csrc/3rdparty/cutlass/include",
    "third_party/DeepSelect/csrc/3rdparty/kerutils/include",
]

[kernels.copy_rows]
source = "source/copy_rows.cu"
flags = "default"
sha256 = "ac0a69424924e3329368fc5bc97d6dcea5df56bf402cf3eababbf2d969177fbe"

[kernels.dsv41_auxiliary]
source = "source/auxiliary/auxiliary.cu"
flags = "nofma"
sha256 = "ac1032271d7ef680ff5fe21e8a346c7a482d433d9d6cca28ac1a2c81a95db00d"

[kernels.dsv41_engram_peers]
source = "source/auxiliary/engram_peers.cu"
flags = "nofma"
sha256 = "dd90f061db9cd365e549aa0a9509c591516918d5543fb23f8a37d031336ee64a"

[kernels.dsv41_head]
source = "source/head.cu"
flags = "plain"
sha256 = "deea7150d71f4d977134eb55888d4af0ac2b5397095b5f8946ebd2842bbc3e2d"

[kernels.dsv41_moe_boundary]
source = "source/moe/boundary.cu"
flags = "plain-nofma"
sha256 = "f8d2c2761ceafffd0e50f1d159de9ab3410b661e42af2da74f1e5eed26a04626"

[kernels.dsv41_mhc]
source = "source/moe/mega_mhc.cu"
flags = "deepgemm"
includes = "deepgemm"
sha256 = "1bddd0ce1e83f82900814ff0ee4710e282b47e604d9481280b5820de6b1634aa"

[kernels.dsv41_gate]
