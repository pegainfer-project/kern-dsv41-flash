[kernels.dsv41_spec_round]
source = "source/spec_round.cu"
flags = "default"
sha256 = "83a1cd23bb15864787adb483d4a8b0737fb2c1c4d3a875750306d9a0f1ac0b8a"

# The MegaMoE ring is sized from the pool its persistent grid drains: one
# layout per expert count and SM count the cubin carries an instance for.
[layouts]
tool = "source/moe/moe_layout.cu"
flags = "deepgemm"
includes = "deepgemm"
# (experts, most tokens a rank feeds one call): the draft MoE decodes only.
instances = [[128, 8192], [384, 8192], [384, 32768]]
sms = [148, 152]
